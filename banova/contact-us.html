<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banova — Get in Touch</title>
    <link rel="icon" type="image/png" href="banova-x-icon.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
          :root{
            --navy:#142748;
            --navy2:#1b3157;
            --yellow:#ffb900;
            --white:#f9fafc;
            --muted:#d7deea;
            --card:#1a3157;
            --line:rgba(255,255,255,.10);
          }
          html{scroll-behavior:smooth}
          body{
            min-height:100vh;
            overflow-x:hidden;
            font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            color:var(--white);
            background:
              radial-gradient(circle at 50% 35%,rgba(48,76,119,.20),transparent 38%),
              linear-gradient(135deg,#172b4d 0%,#112342 100%);
          }
          .page{
            position:relative;
            min-height:100vh;
            padding:58px 28px 72px;
            isolation:isolate;
            overflow: hidden;
          }
          .page:after{
            content:"";
            position:absolute;
            z-index:-1;
            left:-8%;
            right:-8%;
            bottom:-170px;
            height:330px;
            border-top:1px solid rgba(255,185,0,.08);
            border-radius:50%;
            transform:rotate(-5deg);
            box-shadow:0 -20px 0 rgba(255,255,255,.015),0 -42px 0 rgba(255,255,255,.012);
          }
        
          .page:before {
            content: "";
            position: absolute;
            z-index: -1;
            left: -8%;
            right: -8%;
            top: 100px;
            height: 330px;
            border-top: 1px solid rgba(255, 185, 0, .08);
            border-radius: 50%;
            transform: rotate(-5deg);
            box-shadow: 0 -20px 0 rgba(255, 255, 255, .015), 0 -42px 0 rgba(255, 255, 255, .012);
        }
        
          .container{width:min(1050px,100%);margin:auto}
          .brand{
            width: 330px;
            height:auto;
            display:block;
            margin:0 auto 34px;
            filter:drop-shadow(0 13px 12px rgba(0,0,0,.27));
          }
        
          .intro{text-align:center;max-width:760px;margin:0 auto 38px}
          .eyebrow{
            display:inline-flex;
            align-items:center;
            gap:13px;
            color:var(--yellow);
            font-size:13px;
            font-weight:800;
            letter-spacing:.24em;
            text-transform:uppercase;
            margin-bottom:12px;
          }
          .eyebrow:before,.eyebrow:after{
            content:"";
            width:38px;
            height:3px;
            border-radius:20px;
            background:var(--yellow);
            opacity:.9;
          }
          h1{
            font-size:clamp(52px,8vw,92px);
            line-height:.96;
            letter-spacing:-.055em;
            font-weight:900;
            color:#fff;
            text-shadow:0 5px 0 rgba(0,0,0,.08);
          }
          h1 span{color:var(--yellow)}
          .intro p{
            max-width:570px;
            margin:24px auto 0;
            color:var(--muted);
            font-size:17px;
            line-height:1.7;
          }
        
          .social-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:22px;
            max-width:920px;
            margin:auto;
            margin-block: 5rem;
          }
          .social{
            position:relative;
            min-height:235px;
            padding:31px 20px 25px;
            border-radius:25px;
            background:
              linear-gradient(145deg,rgba(40,65,103,.78),rgba(17,39,71,.78));
            border:1px solid rgba(255,255,255,.10);
            box-shadow:
              inset 0 1px 0 rgba(255,255,255,.04),
              0 17px 35px rgba(0,0,0,.18);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            overflow:hidden;
            transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
          }
          .social:before{
            content:"";
            position:absolute;
            width:150px;height:150px;
            top:-82px;right:-68px;
            border:1px solid rgba(255,185,0,.12);
            border-radius:50%;
          }
          .social:hover{
            transform:translateY(-7px);
            border-color:rgba(255,185,0,.45);
            box-shadow:0 23px 40px rgba(0,0,0,.25);
          }
          .icon-ring{
            width:83px;height:83px;
            border-radius:50%;
            display:grid;
            place-items:center;
            background:#0d1f3a;
            border: 1px solid #ffffff5c;
            padding:8px;
            margin-bottom:17px;
            position:relative;
            box-shadow:0 0 0 7px rgba(255,185,0,.025);
          }
          .icon{
            width:58px;height:58px;
            border-radius:50%;
            display:grid;
            place-items:center;
            font-size:30px;
            font-weight:900;
            color:#fff;
            box-shadow:0 6px 13px rgba(0,0,0,.22);
          }
          .facebook{background:#1877f2}
          .instagram{background:linear-gradient(135deg,#feda75,#d62976 55%,#4f5bd5)}
          .tiktok{background:#050505}
          .youtube{background:#ff0000}
          .linkedin{background:#0a76b4}
          .x{background:#000}
          .icon svg{width:32px;height:32px;fill:currentColor}
          .social h2{
            font-size:21px;
            line-height:1.15;
            font-weight:850;
            margin-bottom:10px;
          }
          .social h2:after{
            content:"";
            display:block;
            width:31px;
            height:3px;
            background:var(--yellow);
            margin:10px auto 0;
            border-radius:4px;
          }
          .handle{
            color:#d8dfeb;
            font-size:14px;
            line-height:1.4;
            word-break:break-word;
          }
          .footer{
            text-align:center;
            margin:46px auto 0;
            color:#9eabc0;
            font-size:12px;
            letter-spacing:.08em;
          }
        
          .brand {
            animation: logoReveal 1s cubic-bezier(.22, 1, .36, 1) both;
            }
        
            .eyebrow {
            animation: slideFromLeft .9s cubic-bezier(.22, 1, .36, 1) .15s both;
            }
        
            h1 {
            animation: slideFromRight 1s cubic-bezier(.22, 1, .36, 1) .2s both;
            }
        
            .intro p {
            animation: slideFromLeft 1s cubic-bezier(.22, 1, .36, 1) .3s both;
            }
        
            .social {
            opacity: 0;
            animation-duration: 1s;
            animation-timing-function: cubic-bezier(.22, 1, .36, 1);
            animation-fill-mode: both;
            }
        
            .social:nth-child(odd) {
            animation-name: cardFromLeft;
            }
        
            .social:nth-child(even) {
            animation-name: cardFromRight;
            }
        
            .social:nth-child(1) {
            animation-delay: .40s;
            }
        
            .social:nth-child(2) {
            animation-delay: .48s;
            }
        
            .social:nth-child(3) {
            animation-delay: .56s;
            }
        
        
            /* =========================
            KEYFRAMES
            ========================= */
        
            @keyframes logoReveal {
            0% {
                opacity: 0;
                transform: translateY(-30px) scale(.94);
            }
        
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            }
        
            @keyframes slideFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-90px);
            }
        
            100% {
                opacity: 1;
                transform: translateX(0);
            }
            }
        
            @keyframes slideFromRight {
            0% {
                opacity: 0;
                transform: translateX(90px);
            }
        
            100% {
                opacity: 1;
                transform: translateX(0);
            }
            }
        
            @keyframes cardFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-140px);
            }
        
            100% {
                opacity: 1;
                transform: translateX(0);
            }
            }
        
            @keyframes cardFromRight {
            0% {
                opacity: 0;
                transform: translateX(140px);
            }
        
            100% {
                opacity: 1;
                transform: translateX(0);
            }
            }
        
            @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        
            .social {
                opacity: 1;
            }
            }
        
          @media(max-width:760px){
            .page{padding:42px 18px 55px}
            .brand{width:175px;margin-bottom:27px}
            .intro{margin-bottom:27px}
            h1{font-size:clamp(48px,15vw,72px)}
            .intro p{font-size:15px;margin-top:18px}
            .social-grid{grid-template-columns:repeat(2,1fr);gap:15px}
            .social{min-height:205px;border-radius:21px;padding:24px 14px}
            .icon-ring{width:70px;height:70px}
            .icon{width:48px;height:48px}
            .icon svg{width:27px;height:27px}
            .social h2{font-size:18px}
            .handle{font-size:13px}
          }
          @media(max-width:470px){
            .page{padding-left:13px;padding-right:13px}
            .brand{width:155px}
            .eyebrow{font-size:10px;letter-spacing:.18em;gap:8px}
            .eyebrow:before,.eyebrow:after{width:24px}
            h1{font-size:51px}
            .intro p{font-size:14px;line-height:1.55}
            .social-grid{grid-template-columns:1fr 1fr;gap:10px}
            .social{min-height:190px;padding:19px 8px}
            .icon-ring{width:61px;height:61px;padding:6px;margin-bottom:13px}
            .icon{width:45px;height:45px}
            .icon svg{width:24px;height:24px}
            .social h2{font-size:16px;margin-bottom:7px}
            .social h2:after{width:24px;height:2px;margin-top:8px}
            .handle{font-size:11px}
          }
          @media(max-width: 500px){
            .social-grid {grid-template-columns: repeat(1, 1fr);}
          }
    </style>
</head>
